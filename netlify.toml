[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://vvc-office-v4.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "https://vvc-office-v4.onrender.com/page/home"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "https://vvc-office-v4.onrender.com/page/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
