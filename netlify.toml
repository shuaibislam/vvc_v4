[build]
  publish = "."

# API proxy → Render
[[redirects]]
  from = "/api/*"
  to = "https://vvc-office-v4.onrender.com/api/:splat"
  status = 200
  force = true

# Root → home
[[redirects]]
  from = "/"
  to = "https://vvc-office-v4.onrender.com/page/home"
  status = 200
  force = true

# All pages → backend
[[redirects]]
  from = "/*"
  to = "https://vvc-office-v4.onrender.com/page/:splat"
  status = 200
